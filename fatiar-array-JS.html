<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>slice</title>
</head>
<body>
    <h1> Fatiar Array</h1>
    <div id="saida"></div>

    <script>
        let frutas = ["maçã", "banana", "uva", "laranja", "manga"];
        let saida = document.getElementById("saida");

        saida.innerHTML += "Array original: " + frutas + "<br><br>";
        saida.innerHTML += "slice(1, 3): " + frutas.slice(1, 3) + "<br>";
        saida.innerHTML += "slice(2): " + frutas.slice(2) + "<br><br>";
        saida.innerHTML += "Original ainda: " + frutas;
    </script>
</body>
</html>

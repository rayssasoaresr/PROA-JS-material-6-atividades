<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>splice</title>
</head>
<body>
    <h1> Modificar Array</h1>
    <div id="saida"></div>

    <script>
        let frutas = ["maçã", "banana", "uva", "laranja"];
        let saida = document.getElementById("saida");

        saida.innerHTML += "Original: " + frutas + "<br>";

        frutas.splice(1, 2);
        saida.innerHTML += "Após splice(1, 2): " + frutas + "<br>";

        frutas.splice(1, 0, "morango", "kiwi");
        saida.innerHTML += "Após splice(1, 0, 'morango', 'kiwi'): " + frutas;
    </script>
</body>
</html>

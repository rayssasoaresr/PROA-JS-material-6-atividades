<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Arrays</title>
</head>
<body>
  <h1> 3 Arrays</h1>
  <div id="saida"></div>

  <script>

    let nomes = ["Ana", "Larissa", "Leonardo"];

    let numeros = [ 10, 20, 30, 40, 50 ];

    let cores = ["Preto", "Roxo", "Cinza", "Branco"];

    document.getElementById("saida").innerHTML =
      "Nomes: " + nomes + "<br>" +
      "Números: " + numeros + "<br>" +
      "Cores: " + cores;
  </script>
</body>
</html>

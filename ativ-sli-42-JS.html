<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Métodos</title>
</head>
<body>
    <h1>Métodos</h1>
    <div id="saida"></div>

    <script>
        let nomes = ["Ana", "Bruno", "Carla", "Daniel"];
        let saida = document.getElementById("saida");

        saida.innerHTML += "Array inicial: " + nomes + "<br>";

        saida.innerHTML += "a) Posição de Carla: " + nomes.indexOf("Carla") + "<br>";


        let novoArray = nomes.slice(1, 3);
        saida.innerHTML += "b) Novo array com slice(1, 3): " + novoArray + "<br>";


        nomes.splice(0, 1);

        
        saida.innerHTML += "d) Array final após remover Ana: " + nomes + "<br>";
    </script>
</body>
</html>

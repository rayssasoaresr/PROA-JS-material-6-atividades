<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acessando Arrays</title>
</head>
<body>
    <h1> Acessando Arrays</h1>
    <div id="saida"></div>

    <script>
        let frutas = ["maçã", "banana", "uva", "laranja"];
        let saida = document.getElementById("saida");

        saida.innerHTML += "Posição 0: " + frutas[0] + "<br>";
        saida.innerHTML += "Posição 1: " + frutas[1] + "<br>";
        saida.innerHTML += "Posição 2: " + frutas[2] + "<br>";
        saida.innerHTML += "Posição 3: " + frutas[3] + "<br>";
        saida.innerHTML += "Posição 4: " + frutas[4] + "<br>";
    </script>
</body>
</html>
